# =============================================================================
# Taller Evaluativo 2 - Fase 3: Orquestación del Ecosistema CI/CD
# Sonatype Nexus (repositorio de artefactos: maven-releases + docker-hosted)
#
# Complete los TODOs para levantar Nexus.
# =============================================================================
version: "3.9"

services:
  nexus:
    image: sonatype/nexus3:3.68.1
    container_name: nexus
    networks:
      - cicd_network
    ports:
      - "${NEXUS_UI_PORT:-9081}:8081"
      - "${NEXUS_DOCKER_PORT:-9080}:9080"
    volumes:
      - nexus_data:/nexus-data
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms512m -Xmx1024m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

networks:
  cicd_network:
    external: true

volumes:
  nexus_data:

